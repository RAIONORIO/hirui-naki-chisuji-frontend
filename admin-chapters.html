<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gerenciar Capítulos | Hirui Admin</title>

    <link
        rel="stylesheet"
        href="style.css?v=28"
    >

    <link
        rel="stylesheet"
        href="admin-layout.css?v=1"
    >

</head>

<body>

    <header class="admin-header">

        <h1>HIRUI ADMIN</h1>

        <nav
            class="admin-header-links"
            aria-label="Navegação administrativa"
        >

            <a href="admin.html">
                VOLTAR AO PAINEL
            </a>

            <a href="index.html">
                VOLTAR AO SITE
            </a>

        </nav>

    </header>

    <main class="admin-page admin-module-page">

        <section class="admin-intro">

            <span>GERENCIAMENTO DE CONTEÚDO</span>

            <h2>CAPÍTULOS</h2>

            <p>
                Crie, edite, publique, oculte ou exclua capítulos. Capas e páginas são administradas em áreas próprias.
            </p>

        </section>

        <section class="admin-grid">


            <div class="admin-card">

                <h3 id="chapter-form-title">
                    CRIAR CAPÍTULO
                </h3>

                <div
                    id="chapter-edit-info"
                    class="admin-edit-info"
                    style="display: none;"
                >
                    Editando capítulo existente
                </div>

                <form
                    id="chapter-form"
                    class="admin-form"
                >

                    <input
                        type="number"
                        id="chapter-number"
                        placeholder="Número do capítulo"
                        required
                    >

                    <input
                        type="text"
                        id="chapter-title"
                        placeholder="Título do capítulo"
                        required
                    >

                    <input
                        type="text"
                        id="chapter-date"
                        placeholder="Data de publicação. Ex: 20 MAI. 2026"
                    >

                    <button
                        type="submit"
                        id="chapter-submit-button"
                    >
                        CRIAR CAPÍTULO
                    </button>

                    <button
                        type="button"
                        id="chapter-cancel-edit-button"
                        class="admin-secondary-button"
                        style="display: none;"
                    >
                        CANCELAR EDIÇÃO
                    </button>

                </form>

                <div
                    id="chapter-message"
                    class="admin-message"
                ></div>

            </div>

            <div class="admin-card admin-card-large">

                <div class="admin-card-header">

                    <h3>CAPÍTULOS CADASTRADOS</h3>

                    <button
                        type="button"
                        id="refresh-chapters-button"
                        class="admin-small-button"
                    >
                        ATUALIZAR LISTA
                    </button>

                </div>

                <div
                    id="chapter-list"
                    class="chapter-list"
                ></div>

            </div>


        </section>

    </main>

    <script src="admin-access.js?v=2"></script>
    <script src="admin.js?v=2"></script>
    <script src="admin-chapters.js?v=1"></script>

</body>

</html>
