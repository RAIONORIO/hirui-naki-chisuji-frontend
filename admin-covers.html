<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gerenciar Capas | Hirui Admin</title>

    <link
        rel="stylesheet"
        href="style.css?v=28"
    >

    <link
        rel="stylesheet"
        href="admin-layout.css?v=1"
    >

</head>

<body>

    <header class="admin-header">

        <h1>HIRUI ADMIN</h1>

        <nav
            class="admin-header-links"
            aria-label="Navegação administrativa"
        >

            <a href="admin.html">
                VOLTAR AO PAINEL
            </a>

            <a href="index.html">
                VOLTAR AO SITE
            </a>

        </nav>

    </header>

    <main class="admin-page admin-module-page">

        <section class="admin-intro">

            <span>GERENCIAMENTO DE IMAGENS</span>

            <h2>CAPAS DOS CAPÍTULOS</h2>

            <p>
                Selecione um capítulo para enviar ou substituir sua capa. A lista abaixo mostra a capa atualmente cadastrada.
            </p>

        </section>

        <section class="admin-grid">


            <div class="admin-card">

                <h3>ENVIAR CAPA</h3>

                <form
                    id="cover-form"
                    class="admin-form"
                >

                    <select
                        id="cover-chapter"
                        required
                    >

                        <option value="">
                            Selecione o capítulo
                        </option>

                    </select>

                    <input
                        type="file"
                        id="cover-image"
                        accept="image/jpeg,image/png,image/webp"
                        required
                    >

                    <button type="submit">
                        ENVIAR CAPA
                    </button>

                </form>

                <div
                    id="cover-message"
                    class="admin-message"
                ></div>

            </div>

            <div class="admin-card admin-card-large">

                <div class="admin-card-header">

                    <h3>CAPAS CADASTRADAS</h3>

                    <button
                        type="button"
                        id="refresh-covers-button"
                        class="admin-small-button"
                    >
                        ATUALIZAR LISTA
                    </button>

                </div>

                <div
                    id="cover-list"
                    class="admin-cover-list"
                ></div>

            </div>


        </section>

    </main>

    <script src="admin-access.js?v=2"></script>
    <script src="admin.js?v=2"></script>
    <script src="admin-covers.js?v=1"></script>

</body>

</html>
