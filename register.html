<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Clube dos Leitores | Hirui Naki Chisuji</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header class="navbar">

        <a href="index.html">

            <img src="assets/logo.png"
                 class="logo"
                 alt="Logo">

        </a>

        <nav>

            <a href="index.html">HOME</a>
            <a href="chapters.html">CAPÍTULOS</a>
            <a href="characters.html">PERSONAGENS</a>
            <a href="cla.html">CLÃS</a>
            <a href="universo.html">UNIVERSO</a>
            <a href="gallery.html">GALERIA</a>
            <a href="login.html">LOGIN</a>

        </nav>

    </header>

    <!-- =========================================
         HERO
    ========================================== -->

    <section class="register-hero">

        <div class="register-overlay"></div>

        <div class="register-container">

            <span class="register-tag">

                HIRUI NAKI CHISUJI

            </span>

            <h1>

                CLUBE DOS LEITORES

            </h1>

            <p>

                Receba novos capítulos, curiosidades,
                artes exclusivas, fragmentos ocultos
                e notícias do universo de Hirui Naki Chisuji.

            </p>

            <!-- =========================================
                 FORMULÁRIO
            ========================================== -->

            <form id="register-form"
                  class="register-form">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome completo"
                    required>

                <input
                    type="text"
                    id="apelido"
                    placeholder="Apelido"
                    required>

                <input
                    type="email"
                    id="email"
                    placeholder="E-mail"
                    required>

                <input
                    type="text"
                    id="telefone"
                    placeholder="Telefone">

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required>

                <input
                    type="password"
                    id="confirmar-senha"
                    placeholder="Confirmar senha"
                    required>

                <label class="checkbox-container">

                    <input
                        type="checkbox"
                        checked>

                    Desejo receber notificações.

                </label>

                <button type="submit">

                    TORNAR-SE UM MEMBRO

                </button>

            </form>

            <div id="register-message"></div>

            <div class="login-link">

                Já possui conta?

                <a href="login.html">

                    Entrar

                </a>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
