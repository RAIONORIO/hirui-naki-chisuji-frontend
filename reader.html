<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leitor | Hirui Naki Chisuji</title>

    <link rel="stylesheet" href="style.css?v=27">

</head>

<body class="reader-body protected-page">

    <!-- =========================================
         BARRA SUPERIOR DO LEITOR
    ========================================== -->

    <header class="reader-topbar">

        <a
            href="index.html"
            class="reader-icon-button"
            title="Home"
            aria-label="Voltar para a página inicial"
        >
            ⌂
        </a>

        <button
            type="button"
            onclick="prevPage()"
            class="reader-page-button reader-page-mode-control"
            title="Página anterior"
            aria-label="Página anterior"
        >
            &lt;
        </button>

        <button
            type="button"
            onclick="nextPage()"
            class="reader-page-button reader-page-mode-control"
            title="Próxima página"
            aria-label="Próxima página"
        >
            &gt;
        </button>

        <a
            href="chapters.html"
            class="reader-icon-button"
            title="Capítulos"
            aria-label="Voltar para os capítulos"
        >
            ☰
        </a>

        <!-- =========================================
             CONFIGURAÇÕES DO LEITOR
        ========================================== -->

        <div class="reader-settings">

            <button
                type="button"
                id="reader-settings-button"
                class="reader-icon-button reader-settings-button"
                title="Configurações de leitura"
                aria-label="Abrir configurações de leitura"
                aria-expanded="false"
                aria-controls="reader-settings-menu"
            >
                ⚙
            </button>

            <div
                id="reader-settings-menu"
                class="reader-settings-menu"
                hidden
            >

                <span class="reader-settings-title">
                    MODO DE LEITURA
                </span>

                <button
                    type="button"
                    class="reader-mode-option"
                    data-reader-mode="page"
                >
                    <strong>POR PÁGINA</strong>

                    <small>
                        Uma página de cada vez.
                    </small>
                </button>

                <button
                    type="button"
                    class="reader-mode-option"
                    data-reader-mode="scroll"
                >
                    <strong>POR ROLAGEM</strong>

                    <small>
                        Todas as páginas em sequência.
                    </small>
                </button>

            </div>

        </div>

        <!-- =========================================
             IR PARA PÁGINA
        ========================================== -->

        <div
            class="reader-page-jump reader-page-mode-control"
            aria-label="Ir para página específica"
        >

            <label for="reader-page-input">
                PÁGINA
            </label>

            <input
                type="number"
                id="reader-page-input"
                min="1"
                value="1"
                inputmode="numeric"
                onkeydown="if(event.key === 'Enter'){ goToReaderPage(); }"
            >

            <button
                type="button"
                onclick="goToReaderPage()"
            >
                IR
            </button>

        </div>

    </header>

    <!-- =========================================
         AVISOS DO LEITOR
    ========================================== -->

    <div
        id="reader-message"
        class="reader-message"
        aria-live="polite"
    ></div>

    <!-- =========================================
         LEITOR
    ========================================== -->

    <main class="reader-container">

        <!-- =========================================
             MODO POR PÁGINA
        ========================================== -->

        <img
            id="manga-image"
            alt="Página do mangá"
        >

        <!-- =========================================
             MODO POR ROLAGEM
        ========================================== -->

        <div
            id="reader-scroll-container"
            class="reader-scroll-container"
            hidden
            aria-live="polite"
        ></div>

        <!-- =========================================
             CAPÍTULO CONCLUÍDO
        ========================================== -->

        <section
            id="chapter-finished"
            class="chapter-finished"
        >

            <span>
                CAPÍTULO CONCLUÍDO
            </span>

            <h1>
                Você chegou ao fim deste capítulo.
            </h1>

            <p>
                O próximo capítulo foi desbloqueado, caso já esteja disponível.
            </p>

            <div class="chapter-finished-buttons">

                <button
                    type="button"
                    id="next-chapter-btn"
                >
                    PRÓXIMO CAPÍTULO
                </button>

                <button
                    type="button"
                    onclick="window.location.href='chapters.html'"
                >
                    VOLTAR AOS CAPÍTULOS
                </button>

            </div>

        </section>

        <!-- =========================================
             FRAGMENTO OCULTO
        ========================================== -->

        <div
            id="hidden-fragment"
            class="hidden-fragment"
        >

            <a
                href="reader.html?fragment=cap0#cap=0&page=1"
                id="hidden-fragment-link"
                title="Fragmento Oculto"
            >

                <span class="fragment-icon">
                    ✦
                </span>

                <span class="fragment-text">
                    Fragmento Oculto
                </span>

            </a>

        </div>

        <!-- =========================================
             NAVEGAÇÃO INFERIOR
        ========================================== -->

        <div class="reader-buttons reader-page-mode-control">

            <button
                type="button"
                onclick="prevPage()"
            >
                ⬅ Página anterior
            </button>

            <button
                type="button"
                onclick="nextPage()"
            >
                Próxima página ➜
            </button>

        </div>

    </main>

    <script src="script.js?v=27"></script>

</body>

</html>
